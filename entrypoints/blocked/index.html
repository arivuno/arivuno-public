<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>Short blocked · Arivuno</title>
		<link rel="stylesheet" href="./style.css" />
		<script type="module" src="./main.ts"></script>
	</head>
	<body>
		<main class="shell">
			<section class="card" aria-labelledby="blocked-title">
				<div class="brand" aria-label="Arivuno">
					<img
						class="brand-mark"
						src="/icon/32.png"
						alt=""
						width="32"
						height="32"
					/>
					<span>Arivuno</span>
				</div>

				<p id="eyebrow" class="eyebrow"></p>
				<h1 id="blocked-title"></h1>
				<p id="message" class="message"></p>

				<div class="actions">
					<button id="back-button" class="button button-primary" type="button">
						Go back
					</button>
					<a id="watch-link" class="button button-secondary">
						Watch once in the regular player
					</a>
				</div>

				<p class="privacy-note">
					Processed locally. Nothing was sent to Arivuno.
				</p>
			</section>
		</main>
	</body>
</html>
